name: 'Update ZRAM LZ4'
description: 'Updates LZ4 / LZ4KD compression for ZRAM'
inputs:
  kernel_dir:
    description: 'Path to kernel source directory'
    required: true
    default: 'common'

runs:
  using: "composite"
  steps:
    - name: Update LZ4 for ZRAM
      shell: bash
      run: |
        echo "Applying LZ4 1.10.0 patch for ZRAM..."
        cd ${{ inputs.kernel_dir }}
        git apply ../patches/lz4_1.10.0.patch
        echo "ZRAM LZ4 updated successfully!"
